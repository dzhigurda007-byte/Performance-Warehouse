name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PerformanceWarehouse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: performance-warehouse-apk
          path: android/app/build/outputs/apk/release/PerformanceWarehouse.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Performance Warehouse APK ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Сборка из ветки `${{ github.ref_name }}`, коммит ${{ github.sha }}.
            Установка: скачайте PerformanceWarehouse.apk на телефон и откройте файл.
          files: android/app/build/outputs/apk/release/PerformanceWarehouse.apk
