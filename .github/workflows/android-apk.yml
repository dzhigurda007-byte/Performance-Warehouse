name: Build APK and Windows server

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PerformanceWarehouse.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/PerformanceWarehouse.apk
          if-no-files-found: error

  windows:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build server and web workplace
        run: |
          npm run server:build
          npx expo export --platform web --output-dir dist-web
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Assemble Windows package (portable Node.js + server + web + APK)
        run: |
          set -e
          VER=$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt | grep -o 'node-v22[0-9.]*-win-x64.zip' | head -1)
          curl -fsSL -o node.zip "https://nodejs.org/dist/latest-v22.x/$VER"
          unzip -q node.zip
          PKG=PerformanceWarehouse-Server
          mkdir -p $PKG/node $PKG/web/download
          cp "${VER%.zip}/node.exe" $PKG/node/
          cp server/dist/pw-server.cjs $PKG/
          cp -r dist-web/. $PKG/web/
          cp apk/PerformanceWarehouse.apk $PKG/web/download/
          cp windows/*.cmd windows/README.txt $PKG/
          zip -qr PerformanceWarehouse-Server-Windows.zip $PKG
          ls -la PerformanceWarehouse-Server-Windows.zip
      - name: Assemble online server package (Docker + Caddy HTTPS)
        run: |
          set -e
          ONL=PerformanceWarehouse-Online
          mkdir -p $ONL/app/web/download
          cp online/Dockerfile online/docker-compose.yml online/Caddyfile online/.env.example online/README-online.txt $ONL/
          cp server/dist/pw-server.cjs $ONL/app/
          cp -r dist-web/. $ONL/app/web/
          cp apk/PerformanceWarehouse.apk $ONL/app/web/download/
          zip -qr PerformanceWarehouse-Online.zip $ONL
          ls -la PerformanceWarehouse-Online.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: PerformanceWarehouse-Server-Windows.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: online
          path: PerformanceWarehouse-Online.zip
          if-no-files-found: error

  installer:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Build PerformanceWarehouse-Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          Expand-Archive PerformanceWarehouse-Server-Windows.zip -DestinationPath unz
          Move-Item unz/PerformanceWarehouse-Server windows/pkg
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('assets/icon.png').convert('RGBA').save('windows/app.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $env:PW_VERSION = "2.0.${{ github.run_number }}"
          & $iscc windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item windows/output/PerformanceWarehouse-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: windows/output/PerformanceWarehouse-Setup.exe
          if-no-files-found: error

  release:
    needs: [apk, windows, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Performance Warehouse — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Ветка `${{ github.ref_name }}`, коммит ${{ github.sha }}.

            * **PerformanceWarehouse-Setup.exe** — установщик сервера склада для Windows (рекомендуется).
            * **PerformanceWarehouse.apk** — приложение для Android (телефоны и ТСД).
            * **PerformanceWarehouse-Server-Windows.zip** — тот же сервер без установки (портативная версия):
              распакуйте, запустите `start.cmd`. Инструкция — `README.txt` внутри архива.
            * **PerformanceWarehouse-Online.zip** — онлайн-сервер для VPS в интернете (Docker + автоматический HTTPS),
              вход только по приглашениям. Инструкция — `README-online.txt` внутри архива.
          files: |
            out/PerformanceWarehouse-Setup.exe
            out/PerformanceWarehouse.apk
            out/PerformanceWarehouse-Server-Windows.zip
            out/PerformanceWarehouse-Online.zip
